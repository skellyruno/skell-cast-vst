name: Windows VST3 Only

# SkellCast is a plugin, not a standalone program.
# Always package and validate the Windows VST3 bundle, never an .exe.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'README.md'
      - 'TESTING.md'
      - 'CHANGELOG.md'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'README.md'
      - 'TESTING.md'
      - '.github/workflows/build.yml'

permissions:
  contents: read

# Only superseded PR runs may be cancelled. Manual and main builds are protected.
concurrency:
  group: skellcast-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, validate and package SkellCast VST3
    runs-on: windows-latest
    env:
      SKELL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SKELL_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for package validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Windows x64 VST3 and core tests
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }

      - name: Build Release VST3
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'SkellCast VST3 build failed' }

      - name: Run core regression tests
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'SkellCast core tests failed' }

      - name: Test release package verifier
        run: python -m unittest discover -s packaging/tests -v

      - name: Stage and verify Windows VST3 package
        run: |
          & ./scripts/Package-Windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SkellCast VST3 packaging failed' }

      - name: Test private-preview install, update, backup and rollback
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP ("SkellCast-Installer-Test-" + $env:GITHUB_RUN_ID)
          & ./scripts/Test-Install-SkellCast.ps1 -PackageRoot ./out/SkellCast-VST3-Windows-x64 -InstallerPath ./scripts/Install-SkellCast.ps1 -TestRoot $testRoot
          if ($LASTEXITCODE -ne 0) { throw 'SkellCast install/update/rollback integration tests failed' }

      - name: Validate SkellCast with pluginval strictness 5
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: out/SkellCast-VST3-Windows-x64/SkellCast.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3

      - name: Upload verified Windows VST3 preview
        uses: actions/upload-artifact@v4
        with:
          name: SkellCast-VST3-Windows-x64-verified
          path: out/SkellCast-VST3-Windows-x64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
